name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepack runs pnpm check, including tests, build and resource validation.
      - name: Check, build and package
        run: pnpm pack --pack-destination artifacts

      - name: Upload installable package
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
